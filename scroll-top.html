<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.mxp-scroll-top {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 999;
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  background: #16845b;
  color: #ffffff;
  box-shadow: 0 10px 28px rgba(22,132,91,0.28);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition:
    opacity 0.25s ease,
    visibility 0.25s ease,
    transform 0.25s ease,
    background 0.2s ease;
}

.mxp-scroll-top.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.mxp-scroll-top:hover {
  background: #0d6846;
  transform: translateY(-2px);
}

.mxp-scroll-icon {
  position: relative;
  width: 20px;
  height: 20px;
}

.mxp-scroll-icon::before,
.mxp-scroll-icon::after {
  content: "";
  position: absolute;
  top: 9px;
  width: 10px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
}

.mxp-scroll-icon::before {
  left: 1px;
  transform: rotate(-45deg);
}

.mxp-scroll-icon::after {
  right: 1px;
  transform: rotate(45deg);
}

.mxp-scroll-icon span {
  position: absolute;
  top: 4px;
  left: 9px;
  width: 2px;
  height: 13px;
  border-radius: 2px;
  background: currentColor;
}

@media (max-width: 600px) {
  .mxp-scroll-top {
    right: 16px;
    bottom: 16px;
    width: 45px;
    height: 45px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mxp-scroll-top {
    transition: none;
  }
}
</style>
</head>

<body>

<button
  class="mxp-scroll-top"
  id="mxpScrollTop"
  type="button"
  aria-label="Scroll to top"
  title="Back to top">

  <span
    class="mxp-scroll-icon"
    aria-hidden="true">
    <span></span>
  </span>

</button>

<script>
(function () {

  const button =
    document.getElementById("mxpScrollTop");

  if (!button) return;

  function updateButton() {

    if (window.scrollY > 450) {
      button.classList.add("visible");
    } else {
      button.classList.remove("visible");
    }

  }

  window.addEventListener(
    "scroll",
    updateButton,
    { passive: true }
  );

  button.addEventListener(
    "click",
    function () {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );

  updateButton();

})();
</script>

</body>
</html>
